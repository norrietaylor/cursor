description = "sshd for Cursor Remote-SSH (min-cursor)"

# min-cursor activates sessions with `--loadout cursor` (never through
# default_loadouts) and reaches them as `ssh min-cursor.NAME`: stock ssh whose
# ProxyCommand runs an OpenSSH sshd *inside* the box through
# `min session exec`. Cursor's own Remote-SSH extension (anysphere.remote-ssh)
# then installs its server into /home/.cursor-server, which persists with the
# session.
#
# The box user is uid 1000 with $HOME=/home; every path below hangs off it.

# openssh supplies sshd and ssh-keygen.
# The box already has bash, tar, curl, python3 and zsh,
# which covers Cursor's server; curl is listed so Cursor's installer never
# depends on the base image. rsync works over
# `min-cursor.NAME` with xxhash, its missing runtime library. git: Cursor's
# Source Control runs it in the box (without it: "command 'git.init' not
# found"), and work leaves a box by push.
packages = ["openssh", "curl", "rsync", "xxhash", "git"]

# Minimal's in-box skill for Cursor's agent, which reads user skills from
# ~/.cursor/skills. Vendored from gominimal/minimal-skills (`just skill`);
# `min-cursor setup` copies this loadout's cursor/ directory ($LOADOUT_ROOT).
patches = [
  { description = "minimal-sandbox skill for Cursor's agent", dest = ".cursor/skills/minimal-sandbox/", source = "$LOADOUT_ROOT/skills/minimal-sandbox" },
]

# Prepare the in-box sshd environment. min-cursor repeats this on every
# connect (its PREP script, which also writes the authorized key and makes the
# host key under a lock); doing it here too means the environment file
# reflects the activation. No host key here: an unlocked ssh-keygen would race
# PREP's.
#
# sshd scrubs the environment, so the sshd min-cursor runs has
# PermitUserEnvironment=yes and reads ~/.ssh/environment, written here from
# `env` and filtered exactly as PREP filters it (PROMPT_COMMAND is minimald's
# trigger for the attach banner and breaks an ssh-started bash; MINIMAL_MOTD,
# the banner itself, is kept for the `min:motd` rc line).
#
# The rc lines, each added once (its marker; PREP adds the same lines on
# connect): `min:workbench` moves an interactive shell that starts in $HOME
# (/home, where sshd and Cursor's terminals start) to /workbench; `min:motd`
# then prints the box's banner in the first interactive shell on a terminal,
# with a detach hint that fits ssh, and unsets it so nested shells stay quiet.
# ~/.ssh/environment keeps only the first line of a value, so a multi-line
# MINIMAL_MOTD may not parse: its errors go to /dev/null.
#
# Guarded: a failure here must not abort the activation. Commands that do not
# need stdin get </dev/null: the script itself arrives on the shell's stdin.
[[lifecycle_hooks]]
description = "prepare the in-box sshd environment for min-cursor"
on_activate.type = "inline"
on_activate.value = '''
umask 077
mkdir -p "$HOME/.ssh" </dev/null || true
env </dev/null | grep -E "^[A-Za-z_][A-Za-z0-9_]*=" | grep -Ev "^(TERM|PWD|OLDPWD|SHLVL|_|HOME|USER|LOGNAME|PATH|SSH_[A-Z_]*|PROMPT_COMMAND)=" > "$HOME/.ssh/environment" || true
for rc in "$HOME/.bashrc" "$HOME/.zshrc"; do
  if ! grep -qs "min:workbench" "$rc" </dev/null; then
    printf '%s\n' '# min:workbench (managed by min-cursor)' \
      'case $- in *i*) if [ "$PWD" = "$HOME" ] && [ -d /workbench ]; then cd /workbench; fi ;; esac' >> "$rc" </dev/null || true
  fi
  if ! grep -qs "min:motd" "$rc" </dev/null; then
    printf '%s\n' '# min:motd (managed by min-cursor)' \
      'case $- in *i*) if [ -t 1 ] && [ -n "${MINIMAL_MOTD:-}" ]; then MINIMAL_DETACH_HINT="close the terminal"; eval "$MINIMAL_MOTD" 2>/dev/null; unset MINIMAL_MOTD MINIMAL_DETACH_HINT; fi ;; esac' >> "$rc" </dev/null || true
  fi
done
# bash login shells (what sshd starts) read ~/.bash_profile, not ~/.bashrc.
[ -e "$HOME/.bash_profile" ] || printf '%s\n' '[ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"' > "$HOME/.bash_profile" </dev/null || true
true
'''
